# GitLab Pages publishes the public/ folder made by the job named "pages"
pages:
  tags: 
    - rswl
  stage: deploy
  image: artifactory.tls.renault.fr/docker-icore/swlabs/docker/python/base:3.10
  script:
    # a venv keeps the packages off the runner's own Python if it is a shell runner
    - python3 -m venv .venv
    - .venv/bin/pip install -r requirements.txt
    - .venv/bin/python website/build.py --out public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
